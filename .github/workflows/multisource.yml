name: log-multisource

on:
  schedule:
    - cron: '37 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: multisource
  cancel-in-progress: false

jobs:
  log-multisource:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install --no-audit --no-fund

      - run: node multisource.mjs

      - name: Commit multisource data
        run: |
          git config user.name "polyscalp-bot"
          git config user.email "polyscalp-bot@users.noreply.github.com"
          git add data/multisource
          if ! git diff --cached --quiet; then
            git commit -m "multisource $(date -u +%Y-%m-%dT%H:%MZ)"
            for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done
          fi
